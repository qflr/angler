<!doctype html>
<!--
  Stand-in decoy for the simulated pipeline (no backend). The real decoy is generated and
  hosted by the backend inside the contained sandbox; its URL comes back from
  POST /api/honeypots/{id}/publish. This page is generic on purpose and submits nowhere.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remote Access Portal</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef0f3;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #222;
      }
      .box {
        width: min(340px, calc(100% - 32px));
        background: #fff;
        border: 1px solid #d5d8de;
        border-radius: 4px;
        padding: 28px;
        box-sizing: border-box;
      }
      h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
      p { margin: 0 0 20px; color: #666; font-size: 13px; }
      label { display: block; margin: 12px 0 4px; font-size: 12px; color: #444; }
      input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #c4c8cf; border-radius: 3px; font: inherit; }
      button { margin-top: 18px; width: 100%; padding: 9px; border: 0; border-radius: 3px; background: #2f5d8a; color: #fff; font: inherit; cursor: pointer; }
      footer { margin-top: 18px; font-size: 11px; color: #999; text-align: center; }
    </style>
  </head>
  <body>
    <form class="box" onsubmit="event.preventDefault()">
      <h1>Remote Access Portal</h1>
      <p>Sign in to continue.</p>
      <label for="u">Username</label>
      <input id="u" autocomplete="off" />
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="off" />
      <button type="submit">Sign in</button>
      <footer id="build"></footer>
    </form>
    <script>
      var cve = new URLSearchParams(location.search).get('cve') || '';
      document.getElementById('build').textContent = /^CVE-\d{4}-\d{4,}$/.test(cve) ? 'build ' + cve.toLowerCase() : '';
    </script>
  </body>
</html>
